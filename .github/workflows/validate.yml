name: Build and deploy GLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked Python build and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax-check site scripts
        run: python -m compileall -q scripts
      # Regenerate project/article catalogues and staged output before checking freshness.
      - run: python scripts/stage_site.py
      - run: python scripts/release_check.py
      - run: python scripts/site_audit.py
      - run: python scripts/css_audit.py
      - name: Audit PWA cache and performance budgets
        run: python scripts/performance_budget_audit.py
      - name: Audit workflow pins and public deployment boundary
        run: python scripts/security_audit.py
      - name: Install pinned accessibility and performance audit tools
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - name: Run responsive UI quality audit
        run: python scripts/ui_quality_audit.py
      - name: Upload responsive UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glab-ui-quality-evidence
          path: artifacts/ui-quality/
          if-no-files-found: ignore
      - name: Run Lighthouse mobile performance audits
        run: |
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" npx lhci autorun --config=lighthouserc.mobile.cjs
      - name: Run Lighthouse desktop performance audits
        run: |
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" npx lhci autorun --config=lighthouserc.desktop.cjs
      - name: Upload Lighthouse performance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glab-lighthouse-performance
          path: artifacts/lighthouse/
          if-no-files-found: ignore
      - name: Run production-font and accessibility audit
        run: python scripts/accessibility_font_audit.py
      - name: Upload accessibility and font evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glab-a11y-font-evidence
          path: artifacts/a11y-font/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
